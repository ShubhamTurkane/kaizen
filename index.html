
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0b0b;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;overflow-x:hidden}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px}
::-webkit-scrollbar-track{background:transparent}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.2}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.fade-in{animation:fadeIn 0.25s ease}
.dot1{animation:pulse 1s 0s infinite}
.dot2{animation:pulse 1s 0.2s infinite}
.dot3{animation:pulse 1s 0.4s infinite}
</style>

function Btn({children,onClick,v='primary',s={},disabled=false,full=false}){
  const vs={
    primary:{background:T.accent,color:'#fff',border:'none'},
    secondary:{background:T.surf2,color:T.text,border:`1px solid ${T.border2}`},
    ghost:{background:'transparent',color:T.muted,border:`1px solid ${T.border}`},
    danger:{background:T.redDim,color:T.red,border:`1px solid rgba(239,68,68,0.3)`},
    success:{background:T.greenDim,color:T.green,border:`1px solid rgba(34,197,94,0.3)`},
  };
  return React.createElement('button',{disabled,onClick,style:{padding:'10px 18px',borderRadius:10,cursor:disabled?'not-allowed':'pointer',fontSize:14,fontWeight:600,transition:'all 0.15s',opacity:disabled?0.5:1,width:full?'100%':'auto',...vs[v],...s}},children);
}

  return React.createElement('div',{className:'fade-in',style:{padding:'20px 16px 100px'}},

function EditRoutineView({routine,setRoutine,onSave,onBack}){
  const [showPicker,setShowPicker]=useState(false);
  const [filter,setFilter]=useState('');
  const [muscle,setMuscle]=useState('All');
  const filtered=DB.filter(e=>{
    const mOk=muscle==='All'||e.muscle===muscle;
    const sOk=e.name.toLowerCase().includes(filter.toLowerCase());
    const notAdded=!routine.exercises.find(re=>re.id===e.id);
    return mOk&&sOk&&notAdded;
  });
  const addEx=(ex)=>setRoutine(p=>({...p,exercises:[...p.exercises,{id:ex.id,name:ex.name,muscle:ex.muscle}]}));
  const removeEx=(id)=>setRoutine(p=>({...p,exercises:p.exercises.filter(e=>e.id!==id)}));
  const moveUp=(i)=>{if(i===0)return;const a=[...routine.exercises];[a[i-1],a[i]]=[a[i],a[i-1]];setRoutine(p=>({...p,exercises:a}));};

  return React.createElement('div',{style:{background:T.bg,minHeight:'100vh',paddingBottom:20}},
    React.createElement('div',{style:{display:'flex',alignItems:'center',gap:12,padding:'20px 16px 14px',borderBottom:`1px solid ${T.border}`,position:'sticky',top:0,background:T.bg,zIndex:10}},
      React.createElement('button',{onClick:onBack,style:{background:'none',border:'none',color:T.muted,cursor:'pointer',fontSize:22,lineHeight:1,padding:0}},'←'),
      React.createElement('input',{value:routine.name,onChange:e=>setRoutine(p=>({...p,name:e.target.value})),style:{flex:1,background:'none',border:'none',color:T.text,fontSize:20,fontWeight:800,outline:'none',padding:0},placeholder:'Routine name...'}),
      React.createElement(Btn,{onClick:()=>onSave(routine),s:{padding:'8px 16px',fontSize:13}},'Save')
    ),
    React.createElement('div',{style:{padding:'12px 16px',borderBottom:`1px solid ${T.border}`}},
      React.createElement('input',{value:routine.tag||'',onChange:e=>setRoutine(p=>({...p,tag:e.target.value})),placeholder:'Tag (Day 1, Push, PPL...)',style:{width:'100%',background:T.surf,border:`1px solid ${T.border}`,color:T.text,borderRadius:8,padding:'9px 12px',fontSize:13,outline:'none'}})
    ),
    React.createElement('div',{style:{padding:16}},
      React.createElement('p',{style:{fontSize:11,color:T.muted,fontWeight:700,letterSpacing:'0.06em',textTransform:'uppercase',marginBottom:10}},'Exercises ('+routine.exercises.length+')'),
      React.createElement('div',{style:{display:'flex',flexDirection:'column',gap:6,marginBottom:12}},
        routine.exercises.map((ex,i)=>React.createElement('div',{key:ex.id,style:{background:T.surf,borderRadius:10,padding:'11px 14px',display:'flex',justifyContent:'space-between',alignItems:'center',border:`1px solid ${T.border}`}},
          React.createElement('div',{style:{display:'flex',alignItems:'center',gap:10}},
            React.createElement('button',{onClick:()=>moveUp(i),style:{background:'none',border:'none',color:T.muted2,cursor:'pointer',fontSize:14,padding:'0 2px'}},'↑'),
            React.createElement('div',null,
              React.createElement('span',{style:{fontWeight:600,fontSize:14}},ex.name),
              React.createElement('span',{style:{fontSize:11,color:MC[ex.muscle]||T.muted,marginLeft:8,fontWeight:600}},ex.muscle)
            )
          ),
          React.createElement('button',{onClick:()=>removeEx(ex.id),style:{background:'none',border:'none',color:T.muted2,cursor:'pointer',fontSize:18,padding:'0 4px'}},'✕')
        ))
      ),
      React.createElement('button',{onClick:()=>setShowPicker(true),style:{width:'100%',padding:13,borderRadius:10,background:T.accentDim,border:`1px dashed rgba(249,115,22,0.4)`,color:T.accent,fontSize:14,fontWeight:700,cursor:'pointer'}},'+ Add Exercise')
    ),
    showPicker&&React.createElement('div',{style:{position:'fixed',inset:0,background:'rgba(0,0,0,0.88)',zIndex:200,display:'flex',flexDirection:'column',alignItems:'stretch',justifyContent:'flex-end'},onClick:e=>{if(e.target===e.currentTarget){setShowPicker(false);setFilter('');setMuscle('All');}}},
      React.createElement('div',{style:{background:T.surf,borderRadius:'18px 18px 0 0',maxHeight:'85vh',display:'flex',flexDirection:'column',animation:'slideUp 0.25s ease'},onClick:e=>e.stopPropagation()},
        React.createElement('div',{style:{padding:'14px 16px',borderBottom:`1px solid ${T.border}`,display:'flex',gap:10,alignItems:'center'}},
          React.createElement('input',{autoFocus:true,value:filter,onChange:e=>setFilter(e.target.value),placeholder:'Search exercises...',style:{flex:1,background:T.surf2,border:`1px solid ${T.border}`,color:T.text,borderRadius:8,padding:'9px 12px',fontSize:14,outline:'none'}}),
          React.createElement('button',{onClick:()=>{setShowPicker(false);setFilter('');setMuscle('All');},style:{background:'none',border:'none',color:T.muted,cursor:'pointer',fontSize:22}},'✕')
        ),
        React.createElement('div',{style:{padding:'10px 12px',display:'flex',gap:6,overflowX:'auto',borderBottom:`1px solid ${T.border}`,paddingBottom:10}},
          MUSCLES.map(m=>React.createElement('button',{key:m,onClick:()=>setMuscle(m),style:{padding:'5px 12px',borderRadius:20,border:'none',cursor:'pointer',flexShrink:0,fontSize:11,fontWeight:700,letterSpacing:'0.04em',background:muscle===m?T.accent:T.surf2,color:muscle===m?'#fff':T.muted,transition:'all 0.15s'}},m))
        ),
        React.createElement('div',{style:{overflowY:'auto',flex:1}},
          filtered.length===0&&React.createElement('div',{style:{padding:24,textAlign:'center',color:T.muted,fontSize:14}},'No exercises found'),
          filtered.map(ex=>React.createElement('div',{key:ex.id,onClick:()=>addEx(ex),style:{padding:'13px 16px',borderBottom:`1px solid ${T.border}`,cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center'}},
            React.createElement('div',null,
              React.createElement('div',{style:{fontWeight:600,fontSize:14}},ex.name),
              React.createElement('div',{style:{fontSize:11,color:MC[ex.muscle]||T.muted,marginTop:2}},ex.muscle)
            ),
            React.createElement('span',{style:{color:T.accent,fontSize:20,fontWeight:300}},'+')
          ))
        )
      )
    )
  );
}

function ActiveWorkoutView({wo,timer,prs,onUpdateSet,onToggleSet,onAddSet,onRemoveSet,onFinish,onCancel}){
  const done=wo.exercises.reduce((s,ex)=>s+ex.sets.filter(s=>s.completed).length,0);
  const total=wo.exercises.reduce((s,ex)=>s+ex.sets.length,0);
  const pct=total>0?Math.round(done/total*100):0;

  return React.createElement('div',{style:{background:T.bg,minHeight:'100vh',paddingBottom:30}},
    React.createElement('div',{style:{background:T.surf,borderBottom:`1px solid ${T.border}`,padding:'14px 16px',position:'sticky',top:0,zIndex:50}},
      React.createElement('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}},
        React.createElement('button',{onClick:onCancel,style:{background:T.redDim,border:'none',color:T.red,borderRadius:8,padding:'7px 12px',fontSize:12,fontWeight:700,cursor:'pointer'}},'✕ Cancel'),
        React.createElement('div',{style:{textAlign:'center'}},
          React.createElement('div',{style:{fontSize:12,fontWeight:700,color:T.muted,textTransform:'uppercase',letterSpacing:'0.05em'}},wo.routineName),

      ),

    ),

      wo.exercises.map((ex,exIdx)=>{
        const pr=prs[ex.id];

          React.createElement('div',{style:{padding:'12px 14px 10px',borderBottom:`1px solid ${T.border}`,display:'flex',justifyContent:'space-between',alignItems:'center'}},
            React.createElement('div',null,

            ),

              React.createElement('input',{type:'number',inputMode:'decimal',value:set.weight,onChange:e=>onUpdateSet(exIdx,si,'weight',e.target.value),placeholder:set.prevWeight||'0',style:{background:set.completed?T.greenDim:T.surf2,border:`1px solid ${set.completed?'rgba(34,197,94,0.4)':T.border2}`,color:T.text,borderRadius:8,padding:'0 8px',fontSize:15,fontWeight:700,height:38,textAlign:'center',outline:'none',width:'100%',fontVariantNumeric:'tabular-nums'}}),
              React.createElement('input',{type:'number',inputMode:'numeric',value:set.reps,onChange:e=>onUpdateSet(exIdx,si,'reps',e.target.value),placeholder:set.prevReps||'0',style:{background:set.completed?T.greenDim:T.surf2,border:`1px solid ${set.completed?'rgba(34,197,94,0.4)':T.border2}`,color:T.text,borderRadius:8,padding:'0 8px',fontSize:15,fontWeight:700,height:38,textAlign:'center',outline:'none',width:'100%',fontVariantNumeric:'tabular-nums'}}),

            )),

            )

  const done=workout.exercises.reduce((s,ex)=>s+ex.sets.filter(s=>s.completed).length,0);
  const vol=Math.round(workout.exercises.reduce((s,ex)=>s+ex.sets.filter(s=>s.completed).reduce((ss,set)=>ss+((parseFloat(set.weight)||0)*(parseFloat(set.reps)||0)),0),0));
  const volStr=vol>1000?`${(vol/1000).toFixed(1)}t`:vol+'kg';

  return React.createElement('div',{className:'fade-in',style:{background:T.bg,minHeight:'100vh',padding:'48px 20px 40px',maxWidth:480,margin:'0 auto'}},
    React.createElement('div',{style:{textAlign:'center',marginBottom:32}},
      React.createElement('div',{style:{fontSize:60,marginBottom:12,lineHeight:1}},'🏆'),
      React.createElement('h1',{style:{fontSize:30,fontWeight:900,letterSpacing:'-0.04em',marginBottom:4}},'Workout Done!'),
      React.createElement('p',{style:{color:T.muted,fontSize:14}},workout.routineName)
    ),
    React.createElement('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:24}},
      [{label:'Duration',val:workout.duration+'m'},{label:'Sets',val:done},{label:'Volume',val:volStr}].map(s=>
        React.createElement('div',{key:s.label,style:{background:T.surf,borderRadius:12,padding:'16px 10px',textAlign:'center',border:`1px solid ${T.border}`}},
          React.createElement('div',{style:{fontSize:22,fontWeight:900,color:T.accent}},s.val),
          React.createElement('div',{style:{fontSize:10,color:T.muted,marginTop:3,textTransform:'uppercase',letterSpacing:'0.05em',fontWeight:600}},s.label)
        )
      )
    ),
    workout.prsBroken?.length>0&&React.createElement('div',{style:{background:'rgba(34,197,94,0.1)',border:'1px solid rgba(34,197,94,0.25)',borderRadius:14,padding:'14px 16px',marginBottom:20}},
      React.createElement('p',{style:{color:T.green,fontSize:11,fontWeight:800,letterSpacing:'0.06em',textTransform:'uppercase',marginBottom:8}},'🏅 New Personal Records!'),
      workout.prsBroken.map((pr,i)=>React.createElement('p',{key:i,style:{color:T.green,fontSize:13,marginBottom:i<workout.prsBroken.length-1?4:0}},
        pr.name+': ',React.createElement('strong',null,pr.weight+'kg'),pr.prev?' (was '+pr.prev+'kg)':' (first time!)'
      ))
    ),
    React.createElement('div',{style:{background:T.surf,borderRadius:14,padding:'18px',marginBottom:28,border:`1px solid ${T.border}`}},
      React.createElement('div',{style:{display:'flex',alignItems:'center',gap:6,marginBottom:12}},
        React.createElement('span',{style:{fontSize:16}},'⚡'),
        React.createElement('span',{style:{fontSize:11,color:T.accent,fontWeight:800,letterSpacing:'0.08em',textTransform:'uppercase'}},'AI Coach')
      ),
      aiLoading?React.createElement('div',{style:{display:'flex',gap:6,alignItems:'center'}},
        React.createElement('div',{className:'dot1',style:{width:7,height:7,borderRadius:'50%',background:T.accent}}),
        React.createElement('div',{className:'dot2',style:{width:7,height:7,borderRadius:'50%',background:T.accent}}),
        React.createElement('div',{className:'dot3',style:{width:7,height:7,borderRadius:'50%',background:T.accent}}),
        React.createElement('span',{style:{color:T.muted,fontSize:13,marginLeft:6}},'Analyzing your performance...')
      ):React.createElement('p',{style:{color:T.text,fontSize:15,lineHeight:1.7,margin:0,fontStyle:'italic'}},aiMsg)
    ),
    React.createElement(Btn,{onClick:onDone,s:{width:'100%',padding:15,fontSize:16,borderRadius:12}},'Back to Home')
  );
}

function HistoryView({history,onSelectWorkout,detail,onCloseDetail}){
  if(detail){
    const done=detail.exercises.reduce((s,ex)=>s+ex.sets.filter(s=>s.completed).length,0);
    const vol=Math.round(detail.exercises.reduce((s,ex)=>s+ex.sets.filter(s=>s.completed).reduce((ss,set)=>ss+((parseFloat(set.weight)||0)*(parseFloat(set.reps)||0)),0),0));
    return React.createElement('div',{className:'fade-in',style:{padding:'20px 16px 100px'}},
      React.createElement('button',{onClick:onCloseDetail,style:{background:'none',border:'none',color:T.muted,cursor:'pointer',fontSize:14,marginBottom:16,padding:0,display:'flex',alignItems:'center',gap:6}},'← Back'),
      React.createElement('h2',{style:{fontSize:20,fontWeight:800,marginBottom:4}},detail.routineName),
      React.createElement('p',{style:{color:T.muted,fontSize:12,marginBottom:18}},new Date(detail.date).toLocaleDateString('en-IN',{weekday:'long',month:'long',day:'numeric'})+' · '+detail.duration+'m · '+done+' sets · '+vol+'kg'),
      React.createElement('div',{style:{display:'flex',flexDirection:'column',gap:10}},
        detail.exercises.map(ex=>{
          const completed=ex.sets.filter(s=>s.completed);
          if(!completed.length)return null;
          return React.createElement('div',{key:ex.id,style:{background:T.surf,borderRadius:12,padding:14,border:`1px solid ${T.border}`}},
            React.createElement('div',{style:{fontWeight:700,fontSize:14,marginBottom:8}},
              ex.name,' ',React.createElement('span',{style:{fontSize:11,color:MC[ex.muscle]||T.muted,fontWeight:600}},ex.muscle)
            ),
            completed.map((s,i)=>React.createElement('div',{key:i,style:{fontSize:13,color:T.muted,marginBottom:2}},
              'Set '+(i+1)+': ',React.createElement('span',{style:{color:T.text,fontWeight:600}},s.weight+'kg × '+s.reps+' reps')
            ))
          );

  }
  return React.createElement('div',{className:'fade-in',style:{padding:'20px 16px 100px'}},
    React.createElement('h2',{style:{fontSize:22,fontWeight:800,marginBottom:20}},'History'),
    history.length===0?
      React.createElement('div',{style:{textAlign:'center',padding:'70px 0',color:T.muted}},
        React.createElement('div',{style:{fontSize:48,marginBottom:14}},'📭'),
        React.createElement('p',{style:{fontSize:15}},'No workouts yet.'),
        React.createElement('p',{style:{fontSize:13,marginTop:4}},'Start your first session!')
      ):
      React.createElement('div',{style:{display:'flex',flexDirection:'column',gap:8}},
        history.map(w=>{
          const done=w.exercises.reduce((s,ex)=>s+ex.sets.filter(s=>s.completed).length,0);
          return React.createElement('div',{key:w.id,onClick:()=>onSelectWorkout(w),style:{background:T.surf,borderRadius:12,padding:'14px 16px',border:`1px solid ${T.border}`,cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center'}},
            React.createElement('div',null,
              React.createElement('div',{style:{fontWeight:700,fontSize:14}},w.routineName),
              React.createElement('div',{style:{fontSize:12,color:T.muted,marginTop:3}},w.duration+'m · '+done+' sets'+(w.prsBroken?.length>0?' · 🏆 '+w.prsBroken.length+' PR'+(w.prsBroken.length>1?'s':''):''))
            ),
            React.createElement('div',{style:{textAlign:'right'}},
              React.createElement('div',{style:{fontSize:12,color:T.muted}},new Date(w.date).toLocaleDateString('en-IN',{month:'short',day:'numeric'})),
              React.createElement('div',{style:{fontSize:10,color:T.muted2,marginTop:2}},new Date(w.date).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}))
            )
          );
        })
      )
  );
}

function App(){
  const [view,setView]=useState('home');
  const [routines,setRoutines]=useState(()=>ls.get('gfh-routines',DEF));
  const [hist,setHist]=useState(()=>ls.get('gfh-hist',[]));
  const [prs,setPrs]=useState(()=>ls.get('gfh-prs',{}));
  const [activeWO,setActiveWO]=useState(null);
  const [startTime,setStartTime]=useState(null);
  const [timer,setTimer]=useState('00:00');
  const [completedWO,setCompletedWO]=useState(null);
  const [aiMsg,setAiMsg]=useState('');
  const [aiLoading,setAiLoading]=useState(false);
  const [editingR,setEditingR]=useState(null);
  const [histDetail,setHistDetail]=useState(null);

  useEffect(()=>ls.set('gfh-routines',routines),[routines]);
  useEffect(()=>ls.set('gfh-hist',hist),[hist]);
  useEffect(()=>ls.set('gfh-prs',prs),[prs]);

  useEffect(()=>{
    if(!startTime)return;
    const iv=setInterval(()=>{
      const e=Math.floor((Date.now()-startTime)/1000);
      setTimer(String(Math.floor(e/60)).padStart(2,'0')+':'+String(e%60).padStart(2,'0'));
    },1000);
    return()=>clearInterval(iv);
  },[startTime]);

  const streak=useMemo(()=>{
    if(!hist.length)return 0;
    const dates=[...new Set(hist.map(w=>w.date.slice(0,10)))].sort().reverse();
    const t=new Date().toISOString().slice(0,10);
    const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
    if(dates[0]!==t&&dates[0]!==y)return 0;
    let c=1;
    for(let i=1;i<dates.length;i++){if((new Date(dates[i-1])-new Date(dates[i]))/86400000===1)c++;else break;}
    return c;
  },[hist]);

  const totalVol=useMemo(()=>hist.reduce((s,w)=>s+w.exercises.reduce((es,ex)=>es+ex.sets.filter(s=>s.completed).reduce((ss,s)=>ss+((parseFloat(s.weight)||0)*(parseFloat(s.reps)||0)),0),0),0),[hist]);

  const startWorkout=(routine)=>{
    const wo={
      routineId:routine.id,routineName:routine.name,
      exercises:routine.exercises.map(ex=>{
        const lastEx=hist.flatMap(w=>w.exercises).find(e=>e.id===ex.id&&e.sets?.some(s=>s.completed));
        const lastSets=(lastEx?.sets||[]).filter(s=>s.completed);
        return{id:ex.id,name:ex.name,muscle:ex.muscle,
          sets:Array(Math.max(3,lastSets.length)).fill(null).map((_,i)=>({reps:'',weight:'',completed:false,prevReps:lastSets[i]?.reps||'',prevWeight:lastSets[i]?.weight||''}))};
      })
    };
    setActiveWO(wo);setStartTime(Date.now());setTimer('00:00');setView('active');
  };

  const updateSet=(ei,si,f,v)=>setActiveWO(p=>({...p,exercises:p.exercises.map((ex,i)=>i!==ei?ex:{...ex,sets:ex.sets.map((s,j)=>j!==si?s:{...s,[f]:v})})}));
  const toggleSet=(ei,si)=>setActiveWO(p=>({...p,exercises:p.exercises.map((ex,i)=>i!==ei?ex:{...ex,sets:ex.sets.map((s,j)=>j!==si?s:{...s,completed:!s.completed})})}));
  const addSet=(ei)=>setActiveWO(p=>({...p,exercises:p.exercises.map((ex,i)=>{if(i!==ei)return ex;const l=ex.sets[ex.sets.length-1];return{...ex,sets:[...ex.sets,{reps:'',weight:l?.weight||'',completed:false}]};})}));
  const removeSet=(ei,si)=>setActiveWO(p=>({...p,exercises:p.exercises.map((ex,i)=>{if(i!==ei||ex.sets.length<=1)return ex;return{...ex,sets:ex.sets.filter((_,j)=>j!==si)};})}));

  const finishWorkout=async()=>{
    const dur=Math.round((Date.now()-startTime)/60000);
    const newPrs={...prs};const prsBroken=[];
    activeWO.exercises.forEach(ex=>{
      const done=ex.sets.filter(s=>s.completed&&s.weight);
      if(!done.length)return;
      const maxW=Math.max(...done.map(s=>parseFloat(s.weight)||0));
      const curr=newPrs[ex.id];
      if(!curr||maxW>curr.weight){if(curr)prsBroken.push({name:ex.name,weight:maxW,prev:curr.weight});newPrs[ex.id]={weight:maxW,date:new Date().toISOString()};}
    });
    setPrs(newPrs);
    const workout={id:Date.now().toString(),date:new Date().toISOString(),routineId:activeWO.routineId,routineName:activeWO.routineName,duration:dur,exercises:activeWO.exercises,prsBroken};
    setHist(p=>[workout,...p]);setCompletedWO(workout);setActiveWO(null);setStartTime(null);setView('complete');
    setAiLoading(true);setAiMsg('');
    try{
      const done=activeWO.exercises.reduce((s,ex)=>s+ex.sets.filter(s=>s.completed).length,0);
      const vol=Math.round(activeWO.exercises.reduce((s,ex)=>s+ex.sets.filter(s=>s.completed).reduce((ss,s)=>ss+((parseFloat(s.weight)||0)*(parseFloat(s.reps)||0)),0),0));
      const top=activeWO.exercises.map(ex=>{const m=Math.max(0,...ex.sets.filter(s=>s.completed&&s.weight).map(s=>parseFloat(s.weight)||0));return m>0?ex.name+' '+m+'kg':null;}).filter(Boolean).slice(0,4).join(', ');
      const prT=prsBroken.length?'New PRs: '+prsBroken.map(p=>p.name+' at '+p.weight+'kg').join(', ')+'.':'';
      const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:'You are a high-energy gym coach. User finished '+activeWO.routineName+'. Stats: '+done+' sets, '+vol+'kg total volume, '+dur+' minutes. '+(top?'Key lifts: '+top+'.'  :'')+' '+prT+'\n\nWrite ONE motivational message (2-3 sentences, max 65 words). Reference their specific numbers. If lifting heavy weights (e.g. 100kg+ deadlift, 60kg+ bench), mention they are in the top percentile of gym-goers. Be direct, powerful, not cheesy. End with a forward-looking line. No hashtags, no emojis, no bullet points.'}]})});
      const data=await res.json();
      setAiMsg(data.content?.[0]?.text||'You showed up, you delivered. That discipline separates you from most people. Come back stronger.');
    }catch{setAiMsg('You put in real work today. The consistency you\'re building now is the foundation of something serious. Keep showing up.');}
    setAiLoading(false);
  };

  const saveRoutine=(r)=>{setRoutines(p=>{const e=p.find(x=>x.id===r.id);return e?p.map(x=>x.id===r.id?r:x):[...p,r]});setEditingR(null);setView('routines');};

  const fullScreen=['active','complete','edit-routine'].includes(view);

  return React.createElement('div',{style:{background:T.bg,minHeight:'100vh',color:T.text,fontFamily:'-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif',maxWidth:480,margin:'0 auto',position:'relative'}},
    view==='active'&&activeWO&&React.createElement(ActiveWorkoutView,{wo:activeWO,timer,prs,onUpdateSet:updateSet,onToggleSet:toggleSet,onAddSet:addSet,onRemoveSet:removeSet,onFinish:finishWorkout,onCancel:()=>{setActiveWO(null);setStartTime(null);setView('home');}}),
    view==='complete'&&completedWO&&React.createElement(WorkoutCompleteView,{workout:completedWO,aiMsg,aiLoading,onDone:()=>{setCompletedWO(null);setView('home');}}),
    view==='edit-routine'&&editingR&&React.createElement(EditRoutineView,{routine:editingR,setRoutine:setEditingR,onSave:saveRoutine,onBack:()=>{setEditingR(null);setView('routines');}}),
    !fullScreen&&React.createElement(Fragment,null,
      React.createElement('div',{style:{padding:'18px 16px 14px',borderBottom:`1px solid ${T.border}`,display:'flex',alignItems:'center',justifyContent:'space-between'}},
        React.createElement('span',{style:{fontSize:17,fontWeight:900,letterSpacing:'-0.03em'}},
          React.createElement('span',{style:{color:T.accent}},'▮'),
          ' GymLog'
        ),
        streak>0&&React.createElement('span',{style:{fontSize:13,color:T.accent,fontWeight:700}},streak+' day streak 🔥')
      ),
      view==='home'&&React.createElement(HomeView,{streak,totalWorkouts:hist.length,totalVolume:totalVol,lastWorkout:hist[0],routines,onStartWorkout:startWorkout}),
      view==='routines'&&React.createElement(RoutinesView,{routines,onStartWorkout:startWorkout,onEditRoutine:(r)=>{setEditingR({...r,exercises:[...r.exercises]});setView('edit-routine');},onDeleteRoutine:(id)=>setRoutines(p=>p.filter(r=>r.id!==id)),onCreateRoutine:()=>{setEditingR({id:Date.now().toString(),name:'New Routine',tag:'',exercises:[]});setView('edit-routine');}}),
      view==='history'&&React.createElement(HistoryView,{history:hist,onSelectWorkout:setHistDetail,detail:histDetail,onCloseDetail:()=>setHistDetail(null)}),
      React.createElement(BottomNav,{view,setView:(v)=>{setHistDetail(null);setView(v);}})
    )
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(React.createElement(App));
</script>
</body>
