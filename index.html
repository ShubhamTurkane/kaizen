*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d0d;
  --surf:#1a1a1a;
  --surf2:#222222;
  --surf3:#2a2a2a;
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.14);
  --text:#ffffff;
  --muted:#a0a0a0;
  --muted2:#666666;
  --accent:#39ff14;
  --accent2:#5fff3a;
  --accentDim:rgba(57,255,20,0.1);
  --accentGlow:rgba(57,255,20,0.2);
  --green:#39ff14;
  --greenDim:rgba(57,255,20,0.1);
  --red:#ff4757;
  --redDim:rgba(255,71,87,0.1);
  --gold:#ffd32a;
  --goldDim:rgba(255,211,42,0.1);
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden;min-height:100vh}
h1,h2,h3,.display{font-family:'Inter',sans-serif;letter-spacing:-0.02em}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}
::-webkit-scrollbar-track{background:transparent}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.15}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes popIn{0%{transform:scale(0.92);opacity:0}100%{transform:scale(1);opacity:1}}
.fade-up{animation:fadeUp 0.3s cubic-bezier(0.16,1,0.3,1) forwards}
.pop-in{animation:popIn 0.25s cubic-bezier(0.16,1,0.3,1) forwards}
.dot1{animation:pulse 1.2s 0s infinite}
.dot2{animation:pulse 1.2s 0.25s infinite}
.dot3{animation:pulse 1.2s 0.5s infinite}
.loading-sk{background:linear-gradient(90deg,var(--surf2) 25%,var(--surf3) 50%,var(--surf2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
</style>

// ─── STORAGE (Anthropic persistent storage API with localStorage fallback) ────
const STOR={
  _useNative:typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function',
  async get(key,fb){
    try{
      if(this._useNative){
        const r=await window.storage.get(key);
        return r?JSON.parse(r.value):fb;
      }else{
        const v=localStorage.getItem(key);
        return v?JSON.parse(v):fb;
      }
    }catch{return fb;}
  },
  async set(key,val){
    try{
      if(this._useNative){
        await window.storage.set(key,JSON.stringify(val));
      }else{
        localStorage.setItem(key,JSON.stringify(val));
      }
    }catch(e){console.warn('Storage set failed',e);}
  }
};

function HistoryView({history,onSelectWorkout,detail,onCloseDetail}){
  if(detail){
    const done=detail.exercises.reduce((s,ex)=>s+ex.sets.filter(s=>s.completed).length,0);
    const vol=Math.round(detail.exercises.reduce((s,ex)=>s+ex.sets.filter(s=>s.completed).reduce((ss,set)=>ss+((parseFloat(set.weight)||0)*(parseFloat(set.reps)||0)),0),0));
    return React.createElement('div',{className:'fade-up',style:{padding:'20px 16px 100px'}},
      React.createElement('button',{onClick:onCloseDetail,style:{background:'none',border:'none',color:T.muted,cursor:'pointer',fontSize:14,marginBottom:18,padding:0,display:'flex',alignItems:'center',gap:6}},'← Back'),
      React.createElement('h2',{style:{fontSize:21,fontWeight:800,marginBottom:5,fontFamily:"'Inter',sans-serif"}},detail.routineName),
      React.createElement('p',{style:{color:T.muted,fontSize:12,marginBottom:20}},new Date(detail.date).toLocaleDateString('en-IN',{weekday:'long',month:'long',day:'numeric'})+' · '+detail.duration+'m · '+done+' sets · '+vol+'kg'),
      React.createElement('div',{style:{display:'flex',flexDirection:'column',gap:10}},
        detail.exercises.map(ex=>{
          const completed=ex.sets.filter(s=>s.completed);
          if(!completed.length)return null;
          return React.createElement('div',{key:ex.id,style:{background:T.surf,borderRadius:14,padding:14,border:`1px solid ${T.border}`}},
            React.createElement('div',{style:{fontWeight:700,fontSize:14,marginBottom:10,fontFamily:"'Inter',sans-serif"}},
              ex.name,' ',React.createElement('span',{style:{fontSize:11,color:MC[ex.muscle]||T.muted,fontWeight:700}},ex.muscle)
            ),
            completed.map((s,i)=>React.createElement('div',{key:i,style:{fontSize:13,color:T.muted,marginBottom:3}},
              'Set '+(i+1)+': ',React.createElement('span',{style:{color:T.text,fontWeight:600}},s.weight+'kg × '+s.reps+' reps')
            ))
          );
        })
      )
    );
  }
  return React.createElement('div',{className:'fade-up',style:{padding:'24px 16px 100px'}},
    React.createElement('h2',{style:{fontSize:24,fontWeight:800,marginBottom:22,fontFamily:"'Inter',sans-serif"}},'History'),
    history.length===0?
      React.createElement('div',{style:{textAlign:'center',padding:'80px 0',color:T.muted}},
        React.createElement('div',{style:{fontSize:52,marginBottom:16}},'📭'),
        React.createElement('p',{style:{fontSize:16,fontWeight:600}},'No workouts yet'),
        React.createElement('p',{style:{fontSize:13,marginTop:5,color:T.muted2}},'Complete your first session!')
      ):
      React.createElement('div',{style:{display:'flex',flexDirection:'column',gap:9}},
        history.map(w=>{
          const done=w.exercises.reduce((s,ex)=>s+ex.sets.filter(s=>s.completed).length,0);
          return React.createElement('div',{key:w.id,onClick:()=>onSelectWorkout(w),style:{background:T.surf,borderRadius:14,padding:'15px 16px',border:`1px solid ${T.border}`,cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center',transition:'border-color 0.15s'}},
            React.createElement('div',null,
              React.createElement('div',{style:{fontWeight:700,fontSize:14,fontFamily:"'Inter',sans-serif"}},w.routineName),
              React.createElement('div',{style:{fontSize:12,color:T.muted,marginTop:3}},w.duration+'m · '+done+' sets'+(w.prsBroken?.length>0?' · 🏆 '+w.prsBroken.length+' PR'+(w.prsBroken.length>1?'s':''):''))
            ),
            React.createElement('div',{style:{textAlign:'right'}},
              React.createElement('div',{style:{fontSize:12,color:T.muted}},new Date(w.date).toLocaleDateString('en-IN',{month:'short',day:'numeric'})),
              React.createElement('div',{style:{fontSize:10,color:T.muted2,marginTop:2}},new Date(w.date).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}))
            )
          );
        })
      )
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App(){
  const [view,setView]=useState('home');
  const [routines,setRoutines]=useState(DEF);
  const [hist,setHist]=useState([]);
  const [prs,setPrs]=useState({});
  const [activeWO,setActiveWO]=useState(null);
  const [startTime,setStartTime]=useState(null);
  const [timer,setTimer]=useState('00:00');
  const [completedWO,setCompletedWO]=useState(null);
  const [aiMsg,setAiMsg]=useState('');
  const [aiLoading,setAiLoading]=useState(false);
  const [editingR,setEditingR]=useState(null);
  const [histDetail,setHistDetail]=useState(null);
  const [loaded,setLoaded]=useState(false);
  const [saving,setSaving]=useState(false);

  // ── Load from persistent storage on mount ───────────────────────────────────
  useEffect(()=>{
    (async()=>{
      const [r,h,p]=await Promise.all([
        STOR.get('gl-routines',DEF),
        STOR.get('gl-hist',[]),
        STOR.get('gl-prs',{}),
      ]);
      setRoutines(r);
      setHist(h);
      setPrs(p);
      setLoaded(true);
    })();
  },[]);

  // ── Save to persistent storage on change (debounced) ──────────────────────
  const saveTimeout=useRef(null);
  const debounceSave=useCallback((key,val)=>{
    clearTimeout(saveTimeout.current);
    saveTimeout.current=setTimeout(()=>STOR.set(key,val),500);
  },[]);

  useEffect(()=>{if(loaded)STOR.set('gl-routines',routines);},[routines,loaded]);
  useEffect(()=>{if(loaded)STOR.set('gl-hist',hist);},[hist,loaded]);
  useEffect(()=>{if(loaded)STOR.set('gl-prs',prs);},[prs,loaded]);

  useEffect(()=>{
    if(!startTime)return;
    const iv=setInterval(()=>{
      const e=Math.floor((Date.now()-startTime)/1000);
      setTimer(String(Math.floor(e/60)).padStart(2,'0')+':'+String(e%60).padStart(2,'0'));
    },1000);
    return()=>clearInterval(iv);
  },[startTime]);

  const streak=useMemo(()=>{
    if(!hist.length)return 0;
    const dates=[...new Set(hist.map(w=>w.date.slice(0,10)))].sort().reverse();
    const t=new Date().toISOString().slice(0,10);
    const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
    if(dates[0]!==t&&dates[0]!==y)return 0;
    let c=1;
    for(let i=1;i<dates.length;i++){if((new Date(dates[i-1])-new Date(dates[i]))/86400000===1)c++;else break;}
    return c;
  },[hist]);

  const totalVol=useMemo(()=>hist.reduce((s,w)=>s+w.exercises.reduce((es,ex)=>es+ex.sets.filter(s=>s.completed).reduce((ss,s)=>ss+((parseFloat(s.weight)||0)*(parseFloat(s.reps)||0)),0),0),0),[hist]);

  const startWorkout=(routine)=>{
    const wo={
      routineId:routine.id,routineName:routine.name,
      exercises:routine.exercises.map(ex=>{
        const lastEx=hist.flatMap(w=>w.exercises).find(e=>e.id===ex.id&&e.sets?.some(s=>s.completed));
        const lastSets=(lastEx?.sets||[]).filter(s=>s.completed);
        return{id:ex.id,name:ex.name,muscle:ex.muscle,
          sets:Array(Math.max(3,lastSets.length)).fill(null).map((_,i)=>({reps:'',weight:'',completed:false,prevReps:lastSets[i]?.reps||'',prevWeight:lastSets[i]?.weight||''}))};
      })
    };
    setActiveWO(wo);setStartTime(Date.now());setTimer('00:00');setView('active');
  };

  const updateSet=(ei,si,f,v)=>setActiveWO(p=>({...p,exercises:p.exercises.map((ex,i)=>i!==ei?ex:{...ex,sets:ex.sets.map((s,j)=>j!==si?s:{...s,[f]:v})})}));
  const toggleSet=(ei,si)=>setActiveWO(p=>({...p,exercises:p.exercises.map((ex,i)=>i!==ei?ex:{...ex,sets:ex.sets.map((s,j)=>j!==si?s:{...s,completed:!s.completed})})}));
  const addSet=(ei)=>setActiveWO(p=>({...p,exercises:p.exercises.map((ex,i)=>{if(i!==ei)return ex;const l=ex.sets[ex.sets.length-1];return{...ex,sets:[...ex.sets,{reps:'',weight:l?.weight||'',completed:false,prevReps:'',prevWeight:''}]};})}));
  const removeSet=(ei,si)=>setActiveWO(p=>({...p,exercises:p.exercises.map((ex,i)=>{if(i!==ei||ex.sets.length<=1)return ex;return{...ex,sets:ex.sets.filter((_,j)=>j!==si)};})}));

  const finishWorkout=async()=>{
    const dur=Math.max(1,Math.round((Date.now()-startTime)/60000));
    const newPrs={...prs};const prsBroken=[];
    activeWO.exercises.forEach(ex=>{
      const done=ex.sets.filter(s=>s.completed&&s.weight);
      if(!done.length)return;
      const maxW=Math.max(...done.map(s=>parseFloat(s.weight)||0));
      const curr=newPrs[ex.id];
      if(!curr||maxW>curr.weight){
        if(curr)prsBroken.push({name:ex.name,weight:maxW,prev:curr.weight});
        else prsBroken.push({name:ex.name,weight:maxW,prev:null});
        newPrs[ex.id]={weight:maxW,date:new Date().toISOString()};
      }
    });
    setPrs(newPrs);
    const workout={id:Date.now().toString(),date:new Date().toISOString(),routineId:activeWO.routineId,routineName:activeWO.routineName,duration:dur,exercises:activeWO.exercises,prsBroken};
    const newHist=[workout,...hist];
    setHist(newHist);
    setCompletedWO(workout);setActiveWO(null);setStartTime(null);setView('complete');
    setAiLoading(true);setAiMsg('');
    try{
      const done=activeWO.exercises.reduce((s,ex)=>s+ex.sets.filter(s=>s.completed).length,0);
      const vol=Math.round(activeWO.exercises.reduce((s,ex)=>s+ex.sets.filter(s=>s.completed).reduce((ss,s)=>ss+((parseFloat(s.weight)||0)*(parseFloat(s.reps)||0)),0),0));
      const top=activeWO.exercises.map(ex=>{const m=Math.max(0,...ex.sets.filter(s=>s.completed&&s.weight).map(s=>parseFloat(s.weight)||0));return m>0?ex.name+' '+m+'kg':null;}).filter(Boolean).slice(0,5).join(', ');
      const prT=prsBroken.length?'New PRs: '+prsBroken.map(p=>p.name+' at '+p.weight+'kg'+(p.prev?' (prev '+p.prev+'kg)':' - first ever!')).join(', ')+'.':'';
      const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:`You are an elite gym coach. The athlete just completed ${activeWO.routineName}.\n\nStats: ${done} sets, ${vol}kg total volume, ${dur} minutes.\n${top?'Top lifts: '+top+'.':''}\n${prT}\n\nWrite ONE concise coaching message (2-3 sentences, max 65 words). Reference their specific numbers. Be direct and powerful - no fluff. Mention if they broke PRs. End with something forward-looking. No hashtags, no bullet points, no emojis.`}]})});
      const data=await res.json();
      setAiMsg(data.content?.[0]?.text||'Solid session. The numbers don\'t lie — you\'re building something serious. Come back and push that ceiling higher.');
    }catch{setAiMsg('You put in real work. The consistency you\'re building is the foundation of something serious. Keep showing up.');}
    setAiLoading(false);
  };

  const saveRoutine=(r)=>{
    setRoutines(p=>{const e=p.find(x=>x.id===r.id);return e?p.map(x=>x.id===r.id?r:x):[...p,r]});
    setEditingR(null);setView('routines');
  };

  // ── Loading screen ─────────────────────────────────────────────────────────
  if(!loaded)return React.createElement('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100vh',gap:16,background:T.bg}},
    React.createElement('div',{style:{width:48,height:48,background:`linear-gradient(135deg,${T.accent},#2dd90f)`,borderRadius:16,display:'flex',alignItems:'center',justifyContent:'center',fontSize:24}},'▮'),
    React.createElement('div',{style:{display:'flex',gap:5}},
      ...[0,1,2].map(i=>React.createElement('div',{key:i,className:['dot1','dot2','dot3'][i],style:{width:7,height:7,borderRadius:'50%',background:T.accent}}))
    )
  );

  const fullScreen=['active','complete','edit-routine'].includes(view);

  return React.createElement('div',{style:{background:T.bg,minHeight:'100vh',color:T.text,fontFamily:"'Inter',sans-serif",maxWidth:480,margin:'0 auto',position:'relative'}},
    view==='active'&&activeWO&&React.createElement(ActiveWorkoutView,{wo:activeWO,timer,prs,onUpdateSet:updateSet,onToggleSet:toggleSet,onAddSet:addSet,onRemoveSet:removeSet,onFinish:finishWorkout,onCancel:()=>{if(window.confirm('Cancel workout? Progress will be lost.')){setActiveWO(null);setStartTime(null);setView('home');}}}),
    view==='complete'&&completedWO&&React.createElement(WorkoutCompleteView,{workout:completedWO,aiMsg,aiLoading,onDone:()=>{setCompletedWO(null);setView('home');}}),
    view==='edit-routine'&&editingR&&React.createElement(EditRoutineView,{routine:editingR,setRoutine:setEditingR,onSave:saveRoutine,onBack:()=>{setEditingR(null);setView('routines');}}),
    !fullScreen&&React.createElement(Fragment,null,
      React.createElement('div',{style:{padding:'20px 18px 14px',borderBottom:`1px solid ${T.border}`,display:'flex',alignItems:'center',justifyContent:'space-between',position:'sticky',top:0,background:'rgba(13,13,13,0.95)',backdropFilter:'blur(16px)',zIndex:50}},
        React.createElement('span',{style:{fontSize:19,fontWeight:900,letterSpacing:'-0.04em',fontFamily:"'Inter',sans-serif"}},
          React.createElement('span',{style:{background:`linear-gradient(135deg,${T.accent},${T.accent2})`,WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}},'▮'),
          React.createElement('span',{style:{marginLeft:6}}, 'GymLog')
        ),
        streak>0&&React.createElement('span',{style:{fontSize:12,color:T.gold,fontWeight:700,background:T.goldDim,padding:'5px 10px',borderRadius:8,border:`1px solid rgba(245,158,11,0.2)`}},streak+'d streak 🔥')
      ),
      view==='home'&&React.createElement(HomeView,{streak,totalWorkouts:hist.length,totalVolume:totalVol,lastWorkout:hist[0],routines,onStartWorkout:startWorkout}),
      view==='routines'&&React.createElement(RoutinesView,{routines,onStartWorkout:startWorkout,onEditRoutine:(r)=>{setEditingR({...r,exercises:[...r.exercises]});setView('edit-routine');},onDeleteRoutine:(id)=>{if(window.confirm('Delete this routine?'))setRoutines(p=>p.filter(r=>r.id!==id));},onCreateRoutine:()=>{setEditingR({id:Date.now().toString(),name:'New Routine',tag:'',exercises:[]});setView('edit-routine');}}),
      view==='history'&&React.createElement(HistoryView,{history:hist,onSelectWorkout:setHistDetail,detail:histDetail,onCloseDetail:()=>setHistDetail(null)}),
      React.createElement(BottomNav,{view,setView:(v)=>{setHistDetail(null);setView(v);}})
    )
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(React.createElement(App));
</script>
</body>
</html>
