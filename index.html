<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#120E2E;
  --surf:rgba(30,24,62,0.9);
  --surf2:rgba(44,35,84,0.92);
  --surf3:rgba(55,45,102,0.9);
  --border:rgba(224,229,236,0.1);
  --border2:rgba(224,229,236,0.18);
  --text:#E0E5EC;
  --muted:#AEB7CA;
  --muted2:#78829A;
  --accent:#6E3CBC;
  --accent2:#FF528F;
  --cyan:#00E5FF;
  --accentDim:rgba(110,60,188,0.18);
  --accentGlow:rgba(255,82,143,0.28);
  --green:#00E5FF;
  --greenDim:rgba(0,229,255,0.12);
  --red:#FF528F;
  --redDim:rgba(255,82,143,0.12);
  --gold:#F8D46B;
  --goldDim:rgba(248,212,107,0.12);
}
body{background:radial-gradient(circle at 50% -20%,rgba(110,60,188,0.38),transparent 32%),radial-gradient(circle at 110% 12%,rgba(255,82,143,0.22),transparent 30%),var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden;min-height:100vh}
h1,h2,h3,.display{font-family:'Inter',sans-serif;letter-spacing:-0.02em}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}
::-webkit-scrollbar-track{background:transparent}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.15}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes popIn{0%{transform:scale(0.92);opacity:0}100%{transform:scale(1);opacity:1}}
.fade-up{animation:fadeUp 0.3s cubic-bezier(0.16,1,0.3,1) forwards}
.pop-in{animation:popIn 0.25s cubic-bezier(0.16,1,0.3,1) forwards}
.dot1{animation:pulse 1.2s 0s infinite}
.dot2{animation:pulse 1.2s 0.25s infinite}
.dot3{animation:pulse 1.2s 0.5s infinite}
.loading-sk{background:linear-gradient(90deg,var(--surf2) 25%,var(--surf3) 50%,var(--surf2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
</style>

// ─── STORAGE (Anthropic persistent storage API with localStorage fallback) ────
const STOR={
  _useNative:typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function',
  async get(key,fb){
    try{
      if(this._useNative){
        const r=await window.storage.get(key);
        return r?JSON.parse(r.value):fb;
      }else{
        const v=localStorage.getItem(key);
        return v?JSON.parse(v):fb;
      }
    }catch{return fb;}
  },
  async set(key,val){
    try{
      if(this._useNative){
        await window.storage.set(key,JSON.stringify(val));
      }else{
        localStorage.setItem(key,JSON.stringify(val));
      }
    }catch(e){console.warn('Storage set failed',e);}
  },
  async remove(key){
    try{
      if(this._useNative){
        await window.storage.set(key,JSON.stringify(null));
      }else{
        localStorage.removeItem(key);
      }
    }catch(e){console.warn('Storage remove failed',e);}
  }
};

const ACTIVE_DRAFT_KEY='kz-active-workout';
const ACTIVE_DRAFT_TTL=18*60*60*1000;

const fmtNum=(v)=>{
  if(v==null||v==='')return '';
  const n=parseFloat(v);
  if(!Number.isFinite(n))return String(v);
  return Number.isInteger(n)?String(n):String(n).replace(/\.?0+$/,'');
};

const buildNextGoalsFromWorkout=(workout)=>{
  if(!workout?.exercises)return [];
  const goals=[];
  workout.exercises.forEach(ex=>{
    ex.sets?.forEach((set,idx)=>{
      if(!set.completed)return;
      const reps=parseInt(set.reps,10);
      if(!Number.isFinite(reps)||reps<=0)return;
      goals.push({
        exerciseId:ex.id,
        exerciseName:ex.name,
        muscle:ex.muscle,
        setNo:idx+1,
        weight:fmtNum(set.weight),
        previousReps:reps,
        targetReps:reps+1
      });
    });
  });
  return goals;
};

// ─── APP ──────────────────────────────────────────────────────────────────────
function App(){
  const [view,setView]=useState('home');
  const [routines,setRoutines]=useState(DEF);
  const [hist,setHist]=useState([]);
  const [prs,setPrs]=useState({});
  const [activeWO,setActiveWO]=useState(null);
  const [startTime,setStartTime]=useState(null);
  const [timer,setTimer]=useState('00:00');
  const [completedWO,setCompletedWO]=useState(null);
  const [aiMsg,setAiMsg]=useState('');
  const [aiLoading,setAiLoading]=useState(false);
  const [editingR,setEditingR]=useState(null);
  const [histDetail,setHistDetail]=useState(null);
  const [loaded,setLoaded]=useState(false);
  const activeDraftSave=useRef(null);

  // ── Load from persistent storage on mount ───────────────────────────────────
  useEffect(()=>{
    (async()=>{
      const [r,h,p,draft,oldR,oldH,oldP]=await Promise.all([
        STOR.get('kz-routines',null),
        STOR.get('kz-hist',null),
        STOR.get('kz-prs',null),
        STOR.get(ACTIVE_DRAFT_KEY,null),
        STOR.get('gl-routines',DEF),
        STOR.get('gl-hist',[]),
        STOR.get('gl-prs',{}),
      ]);
      setRoutines(mergeDefaultRoutines(r==null?oldR:r));
      setHist(h==null?oldH:h);
      setPrs(p==null?oldP:p);
      if(draft?.activeWO&&draft?.startTime&&Date.now()-(draft.savedAt||draft.startTime)<ACTIVE_DRAFT_TTL){
        const elapsed=Math.max(0,Math.floor((Date.now()-draft.startTime)/1000));
        setActiveWO(draft.activeWO);
        setStartTime(draft.startTime);
        setTimer(String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(elapsed%60).padStart(2,'0'));
        setView('active');
      }
      setLoaded(true);
    })();
  },[]);

  // ── Save app data and active workout draft ────────────────────────────────
  useEffect(()=>{if(loaded)STOR.set('kz-routines',routines);},[routines,loaded]);
  useEffect(()=>{if(loaded)STOR.set('kz-hist',hist);},[hist,loaded]);
  useEffect(()=>{if(loaded)STOR.set('kz-prs',prs);},[prs,loaded]);

  const clearActiveDraft=useCallback(()=>{
    clearTimeout(activeDraftSave.current);
    STOR.remove(ACTIVE_DRAFT_KEY);
  },[]);

  useEffect(()=>{
    if(!loaded)return;
    clearTimeout(activeDraftSave.current);
    if(activeWO&&startTime){
      activeDraftSave.current=setTimeout(()=>{
        STOR.set(ACTIVE_DRAFT_KEY,{activeWO,startTime,savedAt:Date.now()});
      },120);
    }else{
      STOR.remove(ACTIVE_DRAFT_KEY);
    }
    return()=>clearTimeout(activeDraftSave.current);
  },[activeWO,startTime,loaded]);

  useEffect(()=>{
    if(!startTime)return;
    const iv=setInterval(()=>{
      const e=Math.floor((Date.now()-startTime)/1000);
      setTimer(String(Math.floor(e/60)).padStart(2,'0')+':'+String(e%60).padStart(2,'0'));
    },1000);
    return()=>clearInterval(iv);
  },[startTime]);

  const streak=useMemo(()=>{
    if(!hist.length)return 0;
    const dates=[...new Set(hist.map(w=>w.date.slice(0,10)))].sort().reverse();
    const t=new Date().toISOString().slice(0,10);
    const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
    if(dates[0]!==t&&dates[0]!==y)return 0;
    let c=1;
    for(let i=1;i<dates.length;i++){if((new Date(dates[i-1])-new Date(dates[i]))/86400000===1)c++;else break;}
    return c;
  },[hist]);

  const totalVol=useMemo(()=>hist.reduce((s,w)=>s+w.exercises.reduce((es,ex)=>es+ex.sets.filter(s=>s.completed).reduce((ss,s)=>ss+((parseFloat(s.weight)||0)*(parseFloat(s.reps)||0)),0),0),0),[hist]);

  const startWorkout=(routine)=>{
    const wo={
      routineId:routine.id,routineName:routine.name,
      exercises:routine.exercises.map(ex=>{
        const lastEx=hist.flatMap(w=>w.exercises).find(e=>e.id===ex.id&&e.sets?.some(s=>s.completed));
        const lastSets=(lastEx?.sets||[]).filter(s=>s.completed);
        return{id:ex.id,name:ex.name,muscle:ex.muscle,
          sets:Array(Math.max(3,lastSets.length)).fill(null).map((_,i)=>{
            const prev=lastSets[i];
            const prevReps=parseInt(prev?.reps,10);
            return {
              reps:'',
              weight:'',
              completed:false,
              prevReps:prev?.reps||'',
              prevWeight:prev?.weight||'',
              goalReps:Number.isFinite(prevReps)&&prevReps>0?String(prevReps+1):'',
              goalWeight:prev?.weight?fmtNum(prev.weight):''
            };
          })};
      })
    };
    setActiveWO(wo);setStartTime(Date.now());setTimer('00:00');setView('active');
  };

  const updateSet=(ei,si,f,v)=>setActiveWO(p=>p?({...p,exercises:p.exercises.map((ex,i)=>i!==ei?ex:{...ex,sets:ex.sets.map((s,j)=>j!==si?s:{...s,[f]:v})})}):p);
  const toggleSet=(ei,si)=>setActiveWO(p=>p?({...p,exercises:p.exercises.map((ex,i)=>i!==ei?ex:{...ex,sets:ex.sets.map((s,j)=>j!==si?s:{...s,completed:!s.completed})})}):p);
  const addSet=(ei)=>setActiveWO(p=>p?({...p,exercises:p.exercises.map((ex,i)=>{if(i!==ei)return ex;const l=ex.sets[ex.sets.length-1];return{...ex,sets:[...ex.sets,{reps:'',weight:l?.weight||'',completed:false,prevReps:'',prevWeight:'',goalReps:'',goalWeight:''}]};})}):p);
  const removeSet=(ei,si)=>setActiveWO(p=>p?({...p,exercises:p.exercises.map((ex,i)=>{if(i!==ei||ex.sets.length<=1)return ex;return{...ex,sets:ex.sets.filter((_,j)=>j!==si)};})}):p);

  const finishWorkout=async()=>{
    if(!activeWO)return;
    const completedSets=activeWO.exercises.reduce((s,ex)=>s+ex.sets.filter(set=>set.completed).length,0);
    if(completedSets===0)return;
    const dur=Math.max(1,Math.round((Date.now()-startTime)/60000));
    const newPrs={...prs};const prsBroken=[];
    activeWO.exercises.forEach(ex=>{
      const done=ex.sets.filter(s=>s.completed&&s.weight);
      if(!done.length)return;
      const maxW=Math.max(...done.map(s=>parseFloat(s.weight)||0));
      const curr=newPrs[ex.id];
      if(!curr||maxW>curr.weight){
        if(curr)prsBroken.push({name:ex.name,weight:maxW,prev:curr.weight});
        else prsBroken.push({name:ex.name,weight:maxW,prev:null});
        newPrs[ex.id]={weight:maxW,date:new Date().toISOString()};
      }
    });
    setPrs(newPrs);
    const nextGoals=buildNextGoalsFromWorkout({exercises:activeWO.exercises});
    const workout={id:Date.now().toString(),date:new Date().toISOString(),routineId:activeWO.routineId,routineName:activeWO.routineName,duration:dur,exercises:activeWO.exercises,prsBroken,nextGoals};
    const newHist=[workout,...hist];
    setHist(newHist);
    clearActiveDraft();
    setCompletedWO(workout);setActiveWO(null);setStartTime(null);setView('complete');
    const done=activeWO.exercises.reduce((s,ex)=>s+ex.sets.filter(s=>s.completed).length,0);
    const vol=Math.round(activeWO.exercises.reduce((s,ex)=>s+ex.sets.filter(s=>s.completed).reduce((ss,s)=>ss+((parseFloat(s.weight)||0)*(parseFloat(s.reps)||0)),0),0));
    const volStr=vol>=1000?`${(vol/1000).toFixed(1)}t`:vol+'kg';
    const top=activeWO.exercises.map(ex=>{const m=Math.max(0,...ex.sets.filter(s=>s.completed&&s.weight).map(s=>parseFloat(s.weight)||0));return m>0?ex.name+' '+m+'kg':null;}).filter(Boolean).slice(0,3).join(', ');
    const prLine=prsBroken.length?' You broke '+prsBroken.length+' PR'+(prsBroken.length>1?'s':'')+'.':'';
    setAiLoading(false);
    setAiMsg(`Logged ${done} working sets, ${volStr} total volume, and ${dur} minutes of focused work.${top?' Top lift marks: '+top+'.':''}${prLine} Next session, beat one number with clean form.`);
  };

  const cancelWorkout=()=>{
    if(window.confirm('Cancel workout? Progress will be lost.')){
      clearActiveDraft();
      setActiveWO(null);
      setStartTime(null);
      setView('home');
    }
  };

  const saveRoutine=(r)=>{
    setRoutines(p=>{const e=p.find(x=>x.id===r.id);return e?p.map(x=>x.id===r.id?r:x):[...p,r]});
    setEditingR(null);setView('routines');
  };

  const clearHistory=()=>{
    if(!hist.length)return;
    if(window.confirm('Delete all workout history and PR records?')){
      setHist([]);
      setPrs({});
      setHistDetail(null);
    }
  };

  // ── Loading screen ─────────────────────────────────────────────────────────
  if(!loaded)return React.createElement('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100vh',gap:16,background:T.bg}},
    React.createElement('div',{style:{width:48,height:48,background:T.grad,borderRadius:16,display:'flex',alignItems:'center',justifyContent:'center',fontSize:24,boxShadow:`0 12px 34px ${T.accentGlow}`}},'K'),
    React.createElement('div',{style:{display:'flex',gap:5}},
      ...[0,1,2].map(i=>React.createElement('div',{key:i,className:['dot1','dot2','dot3'][i],style:{width:7,height:7,borderRadius:'50%',background:T.accent}}))
    )
  );

  const fullScreen=['active','complete','edit-routine'].includes(view);

  return React.createElement('div',{style:{background:T.bg,minHeight:'100vh',color:T.text,fontFamily:"'Inter',sans-serif",maxWidth:480,margin:'0 auto',position:'relative'}},
    view==='active'&&activeWO&&React.createElement(ActiveWorkoutView,{wo:activeWO,timer,prs,onUpdateSet:updateSet,onToggleSet:toggleSet,onAddSet:addSet,onRemoveSet:removeSet,onFinish:finishWorkout,onCancel:cancelWorkout}),
    view==='complete'&&completedWO&&React.createElement(WorkoutCompleteView,{workout:completedWO,aiMsg,aiLoading,onDone:()=>{setCompletedWO(null);setView('home');}}),
    view==='edit-routine'&&editingR&&React.createElement(EditRoutineView,{routine:editingR,setRoutine:setEditingR,onSave:saveRoutine,onBack:()=>{setEditingR(null);setView('routines');}}),
    !fullScreen&&React.createElement(Fragment,null,
      React.createElement('div',{style:{padding:'20px 18px 14px',borderBottom:`1px solid ${T.border}`,display:'flex',alignItems:'center',justifyContent:'space-between',position:'sticky',top:0,background:'rgba(18,14,46,0.9)',backdropFilter:'blur(18px)',zIndex:50}},
        React.createElement('span',{style:{fontSize:19,fontWeight:900,letterSpacing:'-0.04em',fontFamily:"'Inter',sans-serif"}},
          React.createElement('span',{style:{background:T.grad,WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}},'K'),
          React.createElement('span',{style:{marginLeft:6}}, 'Kaizen')
        ),
        streak>0&&React.createElement('span',{style:{fontSize:12,color:T.gold,fontWeight:700,background:T.goldDim,padding:'5px 10px',borderRadius:8,border:`1px solid rgba(248,212,107,0.28)`}},streak+'d streak 🔥')
      ),
      view==='home'&&React.createElement(HomeView,{streak,totalWorkouts:hist.length,totalVolume:totalVol,lastWorkout:hist[0],routines,onStartWorkout:startWorkout}),
      view==='routines'&&React.createElement(RoutinesView,{routines,onStartWorkout:startWorkout,onEditRoutine:(r)=>{setEditingR({...r,exercises:[...r.exercises]});setView('edit-routine');},onDeleteRoutine:(id)=>{if(window.confirm('Delete this routine?'))setRoutines(p=>p.filter(r=>r.id!==id));},onCreateRoutine:()=>{setEditingR({id:Date.now().toString(),name:'New Routine',tag:'',exercises:[]});setView('edit-routine');}}),
      view==='history'&&React.createElement(HistoryView,{history:hist,onSelectWorkout:setHistDetail,detail:histDetail,onCloseDetail:()=>setHistDetail(null),onDeleteHistory:clearHistory}),
      React.createElement(BottomNav,{view,setView:(v)=>{setHistDetail(null);setView(v);}})
    )
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(React.createElement(App));
</script>
</body>
</html>
